services:
  wordless-arcade:
    build: .
    image: wordless-arcade:local
    container_name: wordless-arcade
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ADULT_PIN=${ADULT_PIN}
      - TZ=${TZ:-Europe/London}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # The dictionary trie sits at roughly 120MB resident. 512MB is comfortable
    # headroom on a machine with 128GB, while still capping a runaway.
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
