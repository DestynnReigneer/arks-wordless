name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # node:sqlite needs 22.5+. The Dockerfile pins node:22-alpine, so
          # test on the same major to avoid passing here and failing there.
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build without pushing, so a broken Dockerfile fails the PR rather than
      # being discovered at deploy time.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: wordless-arcade:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the image and wait for its own healthcheck to go green. This is
      # what catches a file the Dockerfile forgot to COPY.
      - name: Boot the image and wait for health
        run: |
          docker run -d --name arcade -p 3000:3000 wordless-arcade:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' arcade 2>/dev/null || echo starting)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          echo "--- container logs ---"
          docker logs arcade
          exit 1

      - name: Stop
        if: always()
        run: docker rm -f arcade || true
