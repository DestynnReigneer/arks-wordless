name: CI

# Pull requests only: a push to main is tested by docker-publish.yml before
# it publishes, so running both would test the same commit twice.
on:
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # node:sqlite needs 22.5+. The Dockerfile pins a node:22.x-alpine, so
          # test on the same major to avoid passing here and failing there.
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build without pushing, so a broken Dockerfile fails the PR rather than
      # being discovered at deploy time.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: arks-arcade:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the image and wait for its own healthcheck to go green. This is
      # what catches a file the Dockerfile forgot to COPY.
      - name: Boot the image and wait for health
        run: |
          docker run -d --name arcade -p 3000:3000 arks-arcade:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' arcade 2>/dev/null || echo starting)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          echo "--- container logs ---"
          docker logs arcade
          exit 1

      # A fresh install's ./data is created by Docker as root. The entrypoint
      # must hand it to 1000:1000 and nothing may keep running as root.
      - name: Boot with a root-owned data folder
        run: |
          mkdir -p "$RUNNER_TEMP/data" && sudo chown root:root "$RUNNER_TEMP/data"
          docker run -d --name arcade2 -v "$RUNNER_TEMP/data:/app/data" arks-arcade:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' arcade2 2>/dev/null || echo starting)
            echo "health: $status"
            if [ "$status" = "healthy" ]; then
              owner=$(stat -c '%u:%g' "$RUNNER_TEMP/data/arcade.db")
              echo "arcade.db owner: $owner"
              [ "$owner" = "1000:1000" ] || exit 1
              # BusyBox ps has no -p, so read the owners from /proc.
              owners=$(docker exec arcade2 sh -c 'stat -c %u /proc/1 /proc/$(pgrep -x node)' | sort -u | xargs)
              echo "process owners: $owners"
              [ "$owners" = "1000" ] || { echo "nothing may run as root"; exit 1; }
              exit 0
            fi
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          echo "--- container logs ---"
          docker logs arcade2
          exit 1

      - name: Stop
        if: always()
        run: docker rm -f arcade arcade2 || true
