# Homelab deployment: pulls the image CI already built, never builds locally.
# This is the only file you need on the server -- no checkout required.
#
#   mkdir wordless-arcade && cd wordless-arcade
#   curl -O <raw url of this file>          # or just paste it
#   cp .env.example .env && edit it
#   docker compose pull && docker compose up -d
#
# TZ matters: daily challenges and streaks roll over at local midnight.

services:
  wordless-arcade:
    image: ghcr.io/YOUR_GITHUB_USERNAME/wordless-arcade:latest
    container_name: wordless-arcade
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ADULT_PIN=${ADULT_PIN}
      - TZ=${TZ:-Europe/London}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
